extends:
  - "spectral:oas"
rules:
  api-path-versioning:
    description: "DevEx Failure: All API paths must include a version prefix like /v1/."
    severity: error
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        match: "^/v[0-9]+/"

  api-contact-required:
    description: "Discovery Failure: The info block must contain a contact block for ownership mapping."
    severity: error
    given: "$.info"
    then:
      field: contact
      function: truthy

  api-health-check-convention:
    description: "Telemetry Warning: APIs should expose a standard health endpoint under /v1/health."
    severity: warn
    given: "$.paths"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - "/v1/health"
